# Perfil de producción (Guía 18). Se activa con SPRING_PROFILES_ACTIVE=prod, que entrega el
# EnvironmentFile de systemd (/etc/ferreteria/tienda.env). Reemplaza solo lo que se repite aquí;
# lo demás (dialecto) se toma de application.properties.
# Ningún secreto tiene valor por defecto: si falta una variable, la tienda no arranca.

# Solo escucha en la interfaz local: desde Internet se llega a través de Nginx
server.address=127.0.0.1
server.port=8080

# Detrás de Nginx: respeta X-Forwarded-Proto, Host y Prefix (Swagger publicado en /swagger/tienda/)
server.forward-headers-strategy=framework

# Base y usuario propios de la tienda (los crea deploy/sql/crear_bases.sql)
spring.datasource.url=${TIENDA_DB_URL}
spring.datasource.username=${TIENDA_DB_USER}
spring.datasource.password=${TIENDA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Sin el SQL de cada consulta en el registro (journalctl)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mismo JWT_SECRET que Auth; el issuer rechaza tokens de otro emisor
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ferreteria-los-maestros-auth
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
