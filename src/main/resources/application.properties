spring.application.name=ferreteria
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_los_maestros?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
# Guía 18: igual que en producción, la sesión de base se cierra al terminar el servicio
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Guía 17: este backend solo VALIDA el JWT que emite Auth (8081).
# JWT_SECRET: el valor por defecto es SOLO DE DESARROLLO (el repositorio es público).
# En producción se entrega con $env:JWT_SECRET y debe ser el mismo que usa Auth.
app.jwt.secret=${JWT_SECRET:9QCWoV0ib1XnswybPFzp/h8tvL65SyktrGmx4Ecl5bc=}
app.jwt.issuer=ferreteria-los-maestros-auth

# Guía 18: origen que acepta CORS (en producción va en APP_CORS_ALLOWED_ORIGIN)
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
