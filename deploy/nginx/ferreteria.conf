# Nginx de Ferretería Los Maestros (Guía 18). Se copia a /etc/nginx/sites-available/ferreteria
# Nginx es el único punto HTTP público (puerto 80). Auth (8081) y tienda (8080) escuchan solo en
# 127.0.0.1, así que desde Internet se llega a ellos únicamente por estas rutas.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # React compilado (npm run build) copiado aquí
  root /var/www/ferreteria;
  index index.html;

  # /api/auth-service/v1/auth/login  ->  Auth 127.0.0.1:8081/api/v1/auth/login
  # La barra final de proxy_pass reemplaza el prefijo público por /api/
  location /api/auth-service/ {
    proxy_pass http://127.0.0.1:8081/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Vacío = no se reenvía: un cliente no puede inventar un prefijo en las rutas de la API
    proxy_set_header X-Forwarded-Prefix "";
  }

  # /api/tienda-service/v1/productos  ->  Tienda 127.0.0.1:8080/api/v1/productos
  location /api/tienda-service/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
  }

  # Swagger público para la presentación (diferencia con la guía, que usa túneles SSH).
  # X-Forwarded-Prefix + server.forward-headers-strategy=framework (perfil prod) hacen que
  # Swagger arme sus URL con /swagger/auth, así "Try it out" vuelve a pasar por aquí.
  # Los endpoints siguen protegidos por JWT y rol: Swagger solo muestra la documentación.
  location = /swagger/auth/ {
    return 302 /swagger/auth/swagger-ui/index.html;
  }
  location /swagger/auth/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /swagger/auth;
  }

  location = /swagger/tienda/ {
    return 302 /swagger/tienda/swagger-ui/index.html;
  }
  location /swagger/tienda/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /swagger/tienda;
  }

  # Rutas de React (/catalogo, /admin, /mi-cuenta...): si no es un archivo, entrega index.html
  # y React Router muestra la página. Sin esto, F5 en una ruta interna da 404
  location / {
    try_files $uri $uri/ /index.html;
  }
}
